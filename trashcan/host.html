<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Host - ข้อมูลผู้เล่น</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .host-box { max-width: 760px; margin: 0 auto; text-align: left; }
        .host-box input { padding: 10px 14px; border: 2px solid #b8d6c2; border-radius: 10px; font-size: 16px; width: 240px; max-width: 100%; }
        .host-box button { margin: 6px 6px 6px 0; padding: 10px 22px; border: none; border-radius: 10px; font-size: 15px; cursor: pointer; background: #0f6b48; color: #fff; }
        .host-box button:disabled { opacity: .45; cursor: not-allowed; }
        .host-msg { margin: 10px 0; font-size: 14px; }
        .host-msg.error { color: #c92424; }
        .host-note { font-size: 13px; opacity: .8; margin: 4px 0 10px; }
        .table-wrap { overflow-x: auto; margin-top: 12px; }
        table { border-collapse: collapse; width: 100%; font-size: 14px; background: #fff; }
        th, td { border: 1px solid #cfe3d6; padding: 8px 10px; text-align: left; }
        th { background: #e9f3ec; }
    </style>
</head>
<body>
    <header>
        <div class="logo">HOST</div>
        <h1>ข้อมูลผู้เล่นที่เข้ามาเล่น</h1>
        <p class="challenge-id" id="challenge-id"></p>
    </header>

    <main>
        <section class="host-box">
            <label for="host-key">รหัสผู้จัด</label><br>
            <input type="password" id="host-key" autocomplete="off">
            <button id="load-btn" type="button">โหลดข้อมูล</button>
            <div class="host-msg" id="host-msg"></div>
            <button id="items-btn" type="button" disabled>ดาวน์โหลด Portfolio Items (.json)</button>
            <button id="full-btn" type="button" disabled>ดาวน์โหลดข้อมูลผู้เล่นละเอียด (.json)</button>
            <p class="host-note">Portfolio Items = รูปแบบ Item ตาม Data Contract (ผู้เล่น 1 คน = 1 Item) · ข้อมูลละเอียด = มีชื่อ คะแนน และคำตอบรายชิ้น</p>
            <div class="table-wrap">
                <table id="players-table" hidden>
                    <thead>
                        <tr><th>#</th><th>เวลาที่เล่นล่าสุด</th><th>ชื่อ</th><th>จำนวนรอบ</th><th>คะแนนรอบล่าสุด</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <p class="host-link"><a href="index.html">← กลับหน้าเกม</a></p>
        </section>
    </main>

    <script>
        const keyInput = document.getElementById('host-key');
        const loadBtn  = document.getElementById('load-btn');
        const itemsBtn = document.getElementById('items-btn');
        const fullBtn  = document.getElementById('full-btn');
        const msg      = document.getElementById('host-msg');
        const table    = document.getElementById('players-table');
        let exported = null;    // ข้อมูลล่าสุดที่โหลดมา

        fetch('api/results.php').then(r => r.json()).then(i => {
            document.getElementById('challenge-id').textContent =
                'Challenge ID: ' + i.challengeId + ' · Group ' + i.group;
        }).catch(() => {});

        function show(text, isError) {
            msg.className = 'host-msg' + (isError ? ' error' : '');
            msg.textContent = text;
        }

        loadBtn.addEventListener('click', async () => {
            show('กำลังโหลด...');
            const fd = new FormData();
            fd.append('key', keyInput.value);
            try {
                const res = await fetch('api/export.php', { method: 'POST', body: fd });
                const data = await res.json();
                if (!res.ok) { show(data.error || 'โหลดไม่สำเร็จ', true); return; }
                exported = data;
                render(data);
            } catch (err) {
                show('โหลดไม่สำเร็จ (ตรวจสอบว่าเปิดผ่านเซิร์ฟเวอร์ PHP)', true);
            }
        });

        function render(data) {
            const tbody = table.querySelector('tbody');
            tbody.innerHTML = '';
            data.players.forEach((p, i) => {
                const tr = document.createElement('tr');
                [i + 1, new Date(p.playedAt).toLocaleString('th-TH'), p.displayName,
                 p.attempts, p.score + ' / ' + p.total].forEach(v => {
                    const td = document.createElement('td');
                    td.textContent = v;           // textContent = ปลอดภัยจาก HTML ที่ผู้เล่นพิมพ์
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
            table.hidden = data.players.length === 0;
            itemsBtn.disabled = data.players.length === 0;
            fullBtn.disabled = false;
            show('ผู้เล่น ' + data.totalPlayers + ' คน (บันทึกทั้งหมด ' + data.totalPlays + ' รอบ)');
        }

        function download(content, filename) {
            const blob = new Blob([JSON.stringify(content, null, 2)],
                                  { type: 'application/json;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        }

        // แบบ Portfolio Item: ลิสต์ของ Item (ผู้เล่น 1 คน = 1 Item)
        itemsBtn.addEventListener('click', () => {
            if (exported) download(exported.players.map(p => p.item), exported.challengeId + '-items.json');
        });

        // แบบละเอียด: ชื่อ คะแนน คำตอบ + Item
        fullBtn.addEventListener('click', () => {
            if (exported) download(exported, exported.challengeId + '-players.json');
        });
    </script>
</body>
</html>
